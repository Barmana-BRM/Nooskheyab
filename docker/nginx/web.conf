server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  location / { try_files $uri $uri/ /index.html; add_header X-Content-Type-Options nosniff always; }
  location ~* \.(?:js|css|woff2|svg|png|jpg|jpeg|webp|avif)$ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
}
