events {}
http {
  include /etc/nginx/mime.types;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript application/xml image/svg+xml text/css text/plain;
  log_format safe '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log safe;
  client_max_body_size 6m;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
  upstream api_upstream { server api:4000; }
  upstream web_upstream { server web:8080; }
  upstream minio_upstream { server minio:9000; }
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }
  server {
    listen 443 ssl;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/v1/prescriptions { limit_req zone=public_api burst=20 nodelay; proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /api/ { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /health { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location = /docs { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /docs/ { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location / { proxy_pass http://web_upstream; proxy_set_header Host $host; }
  }
  server {
    listen 443 ssl;
    server_name storage.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    location / { proxy_pass http://minio_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; add_header Cache-Control "private, no-store" always; }
  }
}
