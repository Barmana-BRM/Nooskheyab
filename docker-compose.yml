services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmacy_mvp
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy_dev_password
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pharmacy -d pharmacy_mvp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-dev-access-key
      MINIO_ROOT_PASSWORD: local-dev-secret-key-change-me
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command: >-
      'mc alias set local http://minio:9000 local-dev-access-key local-dev-secret-key-change-me
      && mc mb --ignore-existing local/pharmacy-documents
      && mc anonymous set none local/pharmacy-documents'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pharmacy:pharmacy_dev_password@postgres:5432/pharmacy_mvp
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: local-dev-access-key
      S3_SECRET_KEY: local-dev-secret-key-change-me
      S3_BUCKET: pharmacy-documents
      S3_FORCE_PATH_STYLE: 'true'
      JWT_ACCESS_SECRET: local-development-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: local-development-refresh-secret-at-least-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '4000:4000'
    command:
      [
        'sh',
        '-c',
        'npm run db:migrate --workspace apps/api && npm run db:seed --workspace apps/api && npm run start --workspace apps/api',
      ]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:8080'

volumes:
  postgres_data:
  redis_data:
  minio_data:
