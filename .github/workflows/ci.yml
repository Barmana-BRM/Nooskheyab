name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmacy_mvp
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: pharmacy_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pharmacy -d pharmacy_mvp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://pharmacy:pharmacy_ci_password@localhost:5432/pharmacy_mvp
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: pharmacy-documents
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key
      S3_FORCE_PATH_STYLE: 'true'
      WEB_APP_URL: http://localhost:5173
      API_PUBLIC_URL: http://localhost:4000
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          VITE_API_BASE_URL: http://localhost:4000/api/v1
      - run: npm run cap:sync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
